[project]
name = "harness"
version = "0.1.0"
description = "Bake-off de pipelines foto→3D sobre una muestra fija de piezas de mobiliario."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "pydantic>=2",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "pillow>=10",
    "rembg[cpu]>=2.0.50",
    "onnxruntime>=1.17",
    "trimesh>=4",
    "numpy>=1.26",
    "anthropic>=2.6",
    "google-genai>=1.0",
    "rich>=13",
]

[project.scripts]
bakeoff = "harness.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-httpx>=0.30",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
