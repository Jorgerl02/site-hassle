project_id = "site-hassle"

[auth]
site_url = "https://pieza-3d.vercel.app"
additional_redirect_urls = ["https://pieza-3d.vercel.app/auth/callback", "https://pieza-3d.vercel.app/**", "https://*-rodriguezlorajorge-6960s-projects.vercel.app/auth/callback", "http://localhost:3000/auth/callback", "http://localhost:3000/**", "http://localhost:3150/**"]

# Anonymous free trial: the landing CTA signs the visitor in anonymously (no email) so he can
# create a piece; the email is asked while it generates (optional) or at download. Manual
# linking lets an anonymous user attach Google (`linkIdentity`) when that provider is set up.
enable_anonymous_sign_ins = true
enable_manual_linking = true

# Anti-abuse of the anonymous trial: at most 10 anonymous sign-ins per hour per IP (the web
# also caps anonymous pieces per IP, table `trial_ips`). Turnstile is the next layer (README).
[auth.rate_limit]
anonymous_users = 10

# Unused; stated so a `config push` (CLI 2.116 default: true) keeps it off.
[storage.vector]
enabled = false

# Sign-in links without PKCE: they carry a token hash that /auth/callback verifies with
# verifyOtp, so they work in any browser. A first sign-in gets the «confirmation» email
# (type=signup); later ones the «magic_link» email (type=magiclink). Both need custom SMTP
# (free tier with the default email provider refuses template changes). Apply with
# `supabase config push --project-ref oyntcaxzskzntiyzxquy`.
[auth.email.template.magic_link]
subject = "Your sign-in link for Pieza 3D"
content_path = "./supabase/templates/magic_link.html"

[auth.email.template.confirmation]
subject = "Confirm your email and sign in to Pieza 3D"
content_path = "./supabase/templates/confirmation.html"


# «Continue with Google» (README «Google sign-in»). Do not push this section until both env
# vars exist in the shell that runs `supabase config push`; until then strip it like the
# template sections. `enable_manual_linking` (above) lets an anonymous trial link Google.
[auth.external.google]
enabled = true
client_id = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET)"
skip_nonce_check = false
