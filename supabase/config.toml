project_id = "site-hassle"

[auth]
site_url = "https://pieza-3d.vercel.app"
additional_redirect_urls = ["https://pieza-3d.vercel.app/auth/callback", "https://pieza-3d.vercel.app/**", "https://*-rodriguezlorajorge-6960s-projects.vercel.app/auth/callback", "http://localhost:3000/auth/callback", "http://localhost:3000/**", "http://localhost:3150/**"]

# Sign-in links without PKCE: they carry a token hash that /auth/callback verifies with
# verifyOtp, so they work in any browser. A first sign-in gets the «confirmation» email
# (type=signup); later ones the «magic_link» email (type=magiclink). Both need custom SMTP
# (free tier with the default email provider refuses template changes). Apply with
# `supabase config push --project-ref oyntcaxzskzntiyzxquy`.
[auth.email.template.magic_link]
subject = "Your sign-in link for Pieza 3D"
content_path = "./supabase/templates/magic_link.html"

[auth.email.template.confirmation]
subject = "Confirm your email and sign in to Pieza 3D"
content_path = "./supabase/templates/confirmation.html"

