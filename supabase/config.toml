project_id = "site-hassle"

[auth]
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback", "http://localhost:3000/**"]

# Magic link without PKCE: the link carries a token hash that /auth/callback verifies with
# verifyOtp, so it works when opened in another browser than the one that asked for it.
# Apply with `supabase config push --project-ref oyntcaxzskzntiyzxquy`.
[auth.email.template.magic_link]
subject = "Tu enlace para entrar en Pieza 3D"
content_path = "./supabase/templates/magic_link.html"
